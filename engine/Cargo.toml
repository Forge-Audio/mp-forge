[package]
name = "workbench-engine"
version = "0.1.9"
edition = "2024"
license = "GPL-3.0-or-later"
description = "The engine behind the MPC plugin workbench: safety gate first, AI agent next."

[[bin]]
name = "workbench"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
cpal = "0.18.2"
libloading = "0.9.1"
# Already in the build through the web client. Used here for the sign-in's secret and its fingerprint.
ring = "0.17"
resvg = { version = "0.50.0", default-features = false, features = ["text", "system-fonts"] }
serde = "1.0.229"
serde_json = "1.0.154"
ureq = "3.5.2"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
trash = "5.3"
flate2 = "1"
tar = "0.4"
midir = "0.11.1"

[dev-dependencies]
# Already in the build through other crates. The tests use it to stand in for the port the MPC Sample's controls speak on.
libc = "0.2"

# Decoding an MP3 unoptimised takes seconds for one song, so the decoder is optimised in development builds too.
[profile.dev.package.symphonia-bundle-mp3]
opt-level = 3

[profile.dev.package.symphonia-core]
opt-level = 3
