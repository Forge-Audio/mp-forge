# Builds MP Forge and runs every test on Linux and Windows whenever something is pushed.
#
# The Mac is where MP Forge is written and tested by hand, and a minute on GitHub's Macs costs about ten times a
# minute on Linux. So a Mac is used only when the run is started by hand with "on a Mac too" ticked.
name: Build and test

on:
  push:
  workflow_dispatch:
    inputs:
      on_a_mac_too:
        description: Also build and test on a Mac
        type: boolean
        default: false

# A newer push to the same branch makes the run for the older one pointless.
concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-and-test:
    name: ${{ matrix.system }}
    runs-on: ${{ matrix.system }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        system: ${{ fromJSON(inputs.on_a_mac_too && '["ubuntu-24.04", "windows-latest", "macos-latest"]' || '["ubuntu-24.04", "windows-latest"]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install what the app's window and sound need on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev libasound2-dev

      - name: Use the current Rust
        run: rustup update stable && rustup default stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            engine
            app

      - uses: actions/setup-python@v5
        id: python
        with:
          python-version: "3.12"

      - name: Fetch Akai's SDK at the version in sdk.pin
        run: |
          source sdk.pin
          git clone --quiet "$SDK_REPOSITORY" vendor/mpc-plugin-builder-sdk
          git -C vendor/mpc-plugin-builder-sdk checkout --quiet "$SDK_COMMIT"

      # Akai's build script fetches its compiler and builds its tryout program the first time it builds. Both are
      # tied to the Python that set them up, and kept between runs so that this happens once.
      - uses: actions/cache@v4
        with:
          path: vendor/mpc-plugin-builder-sdk/.sdk-tools
          key: akais-build-tools-${{ runner.os }}-python-${{ steps.python.outputs.python-version }}-${{ hashFiles('sdk.pin') }}

      # The tests build many plugins at once, and each would otherwise try to set those tools up for itself at the
      # same moment. Building one of Akai's own plugins first also shows whether Akai's tools work here at all.
      - name: Build one of Akai's examples, which sets up Akai's build tools
        working-directory: vendor/mpc-plugin-builder-sdk
        run: python tools/build.py examples/StereoDelay

      - name: Test the engine
        working-directory: engine
        run: cargo test --locked

      - name: Test the app
        working-directory: app
        run: cargo test --locked
